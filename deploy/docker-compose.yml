# Local development database for Where to Bird Today.
#
# Run from the REPOSITORY ROOT so that .env is picked up:
#
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d
#   docker compose --env-file .env -f deploy/docker-compose.yml down
#
# The --env-file flag matters: with -f, Compose looks for .env next to the
# compose file (deploy/) rather than in the directory you ran it from.
#
# PostGIS is not optional here. "Hotspots within N km of a point" is a spatial
# query — ST_DWithin against a geography(Point,4326) column with a GiST index
# (master plan §5). Plain Postgres cannot do it.
#
# There is no `version:` key: it has been obsolete since Compose v2 and now
# emits a warning.

name: where-to-bird-today

services:
  db:
    # Pinned deliberately, not :latest — a silent major-version bump would
    # rewrite the data directory format and break the volume below. Keep the
    # major version the same as the Neon project's.
    image: postgis/postgis:18-3.6
    container_name: wtbt-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-birder}
      # No default on purpose. `:?` makes Compose abort with this message
      # rather than quietly starting a database with a blank password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?not set - copy .env.example to .env and fill it in}
      POSTGRES_DB: ${POSTGRES_DB:-wheretobird}
      # Detects silent disk corruption. Can only be set at initdb time, so it
      # is far cheaper to enable now than after there is data to migrate.
      POSTGRES_INITDB_ARGS: "--data-checksums"

    ports:
      # Overridable via POSTGRES_PORT for anyone already running Postgres
      # natively on 5432.
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      # A named volume, not a bind mount: bind-mounting a Postgres data
      # directory onto a Windows host filesystem causes permission and fsync
      # problems. `docker compose down -v` is what deletes it.
      # From Postgres 18 the image keeps data in a folder per major version
      # under /var/lib/postgresql, and refuses to start with a volume on the
      # old .../data path. The volume is named per major version, because a
      # new major version cannot read an older one's files.
      - pgdata18:/var/lib/postgresql

    healthcheck:
      # pg_isready reports "accepting connections", which is later than
      # "container started" — the difference matters, because initdb runs on
      # first boot and takes several seconds. CI and testcontainers wait on
      # this rather than sleeping and hoping.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-birder} -d ${POSTGRES_DB:-wheretobird}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Travel time. Opt-in with --profile routing, because it needs the road
  # graph built first by scripts/build-osrm.ps1 (see the README).
  osrm:
    profiles: ["routing"]
    # Pinned by digest: the road graph files only load in the OSRM version that
    # built them. Keep in step with scripts/build-osrm.ps1.
    image: ghcr.io/project-osrm/osrm-backend@sha256:8a1b1bc938412f15f9b5b32d794c4ec6bf4a85dfbbabfa0a014b70b187edb53b
    container_name: wtbt-osrm
    restart: unless-stopped
    # ch answers a one-to-many table about 7x faster than mld on this graph.
    # --mmap on maps the graph files instead of loading them, so memory use
    # follows what queries touch. --max-table-size must exceed the number of
    # hotspots a search can return.
    command: ["osrm-routed", "--algorithm", "ch", "--mmap", "on", "--max-table-size", "1000", "/data/baltics.osrm"]
    volumes:
      - ../data/osm:/data:ro
    ports:
      - "127.0.0.1:${OSRM_PORT:-5000}:5000"
    # Measured: about 340 MiB in use, and it slows badly below 512 MiB. The
    # limit mirrors the smallest hosting tier so a regression shows up here.
    mem_limit: 512m

volumes:
  pgdata18:
