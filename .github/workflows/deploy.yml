name: Deploy

# Runs after CI passes on main. It builds the image, runs the migrations, and
# points the server and the jobs at the new image. The Azure resources
# themselves are deployed by hand from deploy/main.bicep, so the secrets it
# takes never have to live in GitHub.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Deploys run one at a time and are never cancelled halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: where-to-bird-today

jobs:
  deploy:
    # Skipped until the Azure sign-in is set up (deploy/README.md).
    if: github.event.workflow_run.conclusion == 'success' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    # The Azure login trusts tokens from this environment only (deploy/README.md).
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out the commit CI tested
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Name the image
        # Image names must be lowercase; the repository owner is not.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure
        # OpenID Connect: GitHub vouches for this run, so no Azure password is stored.
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run migrations
        # Before the new server starts, so it never runs against an older schema.
        run: |
          az containerapp job update -g "$RESOURCE_GROUP" -n wtbt-migrate --image "$IMAGE" --output none
          execution=$(az containerapp job start -g "$RESOURCE_GROUP" -n wtbt-migrate --query name -o tsv)
          for _ in $(seq 60); do
            status=$(az containerapp job execution show -g "$RESOURCE_GROUP" -n wtbt-migrate --job-execution-name "$execution" --query properties.status -o tsv)
            echo "migrate: $status"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded) exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::migrations did not finish within 10 minutes"
          exit 1

      - name: Update the server and the scheduled jobs
        run: |
          az containerapp update -g "$RESOURCE_GROUP" -n wtbt-server --image "$IMAGE" --output none
          for job in wtbt-recent wtbt-hotspots wtbt-checklists-lt wtbt-checklists-lv wtbt-checklists-ee wtbt-seasonality; do
            az containerapp job update -g "$RESOURCE_GROUP" -n "$job" --image "$IMAGE" --output none
          done
          echo "Deployed $IMAGE to https://$(az containerapp show -g "$RESOURCE_GROUP" -n wtbt-server --query properties.configuration.ingress.fqdn -o tsv)" >> "$GITHUB_STEP_SUMMARY"
